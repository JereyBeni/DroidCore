<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">DroidCore icon</title>
  <desc id="desc">A rounded square with a stylized Android-like head and a Rust-orange gear, representing DroidCore.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2A3A"/>
      <stop offset="1" stop-color="#0D1620"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bg)"/>
  <!-- Android-like head -->
  <path d="M176 210 A80 80 0 0 1 336 210 Z" fill="#3DDC84"/>
  <circle cx="220" cy="172" r="0" fill="none"/>
  <rect x="164" y="222" width="184" height="150" rx="28" fill="#3DDC84"/>
  <rect x="136" y="232" width="24" height="100" rx="12" fill="#3DDC84"/>
  <rect x="352" y="232" width="24" height="100" rx="12" fill="#3DDC84"/>
  <rect x="200" y="372" width="28" height="70" rx="14" fill="#3DDC84"/>
  <rect x="284" y="372" width="28" height="70" rx="14" fill="#3DDC84"/>
  <!-- Eyes -->
  <circle cx="218" cy="165" r="0" fill="none"/>
  <rect x="204" y="150" width="0" height="0" fill="none"/>
  <!-- Rust-orange gear -->
  <g transform="translate(390 120)">
    <circle r="62" fill="#DEA584"/>
    <circle r="26" fill="#0D1620"/>
    <g fill="#DEA584">
      <rect x="-14" y="-82" width="28" height="36" rx="6"/>
      <rect x="-14" y="46" width="28" height="36" rx="6"/>
      <rect x="-82" y="-14" width="36" height="28" rx="6"/>
      <rect x="46" y="-14" width="36" height="28" rx="6"/>
    </g>
  </g>
</svg>
