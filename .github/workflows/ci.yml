name: CI and desktop builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Test workspace
        run: cargo test --workspace

      - name: Build release application
        run: cargo build -p droidcore --release

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DroidCore-Windows-x64
          path: target/release/droidcore.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Ubuntu build
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: DroidCore-Ubuntu-x64
          path: target/release/droidcore
          if-no-files-found: error
          retention-days: 14
